<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Timeline Desk · Panteon</title>
  <meta name="description" content="Local desk for Panteon Timeline: planner, changes, releases and task workflows.">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <a class="brand-icon" id="page-help" href="#/help" title="Help: how this page gets its data" aria-label="Help for this page"></a>
      <h1>Timeline<span>Desk</span></h1>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to day mode" title="Switch to day mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <nav class="tabs" aria-label="Views">
      <div class="tab-group" role="group" aria-label="Planner">
        <span class="tab-group-label">Planner</span>
        <div class="tab-group-links">
        <a href="#/planner" data-view="planner">Planner</a>
        <a href="#/changes" data-view="changes">Changes</a>
        </div>
      </div>
      <div class="tab-group" role="group" aria-label="Timeline">
        <span class="tab-group-label">Timeline</span>
        <div class="tab-group-links">
        <a href="#/timeline" data-view="timeline">Timeline</a>
        <a href="#/task" data-view="task">Task</a>
        <a href="#/jira" data-view="jira">Jira</a>
        </div>
      </div>
      <div class="tab-group" role="group" aria-label="Workflow">
        <span class="tab-group-label">Workflow</span>
        <div class="tab-group-links">
        <a href="#/workflows" data-view="workflows">Workflows</a>
        </div>
      </div>
      <div class="tab-group" role="group" aria-label="Git">
        <span class="tab-group-label">Git</span>
        <div class="tab-group-links">
        <a href="#/release" data-view="release">Release</a>
        <a href="#/coverage" data-view="coverage">Coverage</a>
        </div>
      </div>
    </nav>
    <div class="top-actions">
      <p class="meta" id="meta">Loading your planner…</p>
      <button type="button" class="btn ghost" id="refresh">Refresh</button>
    </div>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <script src="/static/help.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
